# Langfuse 自托管服务端（可观测性/审计）
# 启动：docker compose -f docker-compose.langfuse.yml up -d
# 访问：http://127.0.0.1:3000（初始账号 admin / admin）
# 然后配置 .env.local：LANGFUSE_ENABLED=true + public/secret key（登录后生成）
services:
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: change-me-in-prod
      SALT: change-me-in-prod
      ENCRYPTION_KEY: change-me-in-prod

volumes:
  langfuse_db_data:
